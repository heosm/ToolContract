[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcontract"
version = "0.1.0"
description = "Static analysis and behavior testing for AI Agent tool definitions."
requires-python = ">=3.10"

dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
toolcontract = "toolcontract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]